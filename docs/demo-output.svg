<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="430" viewBox="0 0 1180 430" role="img" aria-labelledby="title description">
  <title id="title">Sonarr language checker synthetic demo</title>
  <desc id="description">Terminal output from the real CLI using synthetic library data. No Sonarr server was contacted.</desc>
  <rect width="100%" height="100%" rx="14" fill="#111827"/>
  <rect width="100%" height="54" rx="14" fill="#1f2937"/>
  <circle cx="25" cy="27" r="7" fill="#f87171"/>
  <circle cx="49" cy="27" r="7" fill="#fbbf24"/>
  <circle cx="73" cy="27" r="7" fill="#34d399"/>
  <text x="102" y="33" class="chrome">sonarr-lang-checker · synthetic demo</text>
  <text x="36" y="75" class="notice">SYNTHETIC DATA ONLY · NO REQUESTS SENT</text>
  <g class="terminal"><text x="36" y="88" xml:space="preserve">📡 Recupero dati da Sonarr @ https://sonarr.example.invalid/api/v3 ...</text>
<text x="36" y="115" xml:space="preserve">📦 Analisi episodi in corso...</text>
<text x="36" y="142" xml:space="preserve"></text>
<text x="36" y="169" xml:space="preserve">📊 Risultati:</text>
<text x="36" y="196" xml:space="preserve">  [✅ STAGIONE OK]      Another Example - Stagione 1: {&#x27;🇮🇹 ita&#x27;: 2}</text>
<text x="36" y="223" xml:space="preserve">  [✅ SERIE OK]         Another Example: Lingua unica: [🇮🇹 ita]</text>
<text x="36" y="250" xml:space="preserve"></text>
<text x="36" y="277" xml:space="preserve">  [⚠️  STAGIONE MISTA]   Sample Series - Stagione 1: {&#x27;🇬🇧 eng&#x27;: 1, &#x27;🇮🇹 ita&#x27;: 1}</text>
<text x="36" y="304" xml:space="preserve">  [✅ STAGIONE OK]      Sample Series - Stagione 2: {&#x27;🇬🇧 eng&#x27;: 1}</text>
<text x="36" y="331" xml:space="preserve">  [⚠️  SERIE MISTA]      Sample Series: Lingue usate: [🇬🇧 eng, 🇮🇹 ita]</text></g>
  <style>
    .chrome { fill: #d1d5db; font: 14px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .notice { fill: #6ee7b7; font: 700 12px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 1px; }
    .terminal { fill: #f3f4f6; font: 15px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  </style>
</svg>
